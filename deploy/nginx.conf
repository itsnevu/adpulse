# ==========================================================================
# AdPulse — Nginx reverse proxy (produksi, VPS Ubuntu 22.04)
#
# CARA PAKAI:
#   1. Ganti SEMUA "ganti-domain.com" dengan domain asli kamu.
#   2. Salin file ini ke /etc/nginx/sites-available/adpulse
#   3. ln -s /etc/nginx/sites-available/adpulse /etc/nginx/sites-enabled/adpulse
#   4. nginx -t && systemctl reload nginx
#   5. Jalankan certbot (lihat deploy/DEPLOYMENT.md) — certbot akan
#      menambahkan blok SSL (listen 443) secara otomatis.
#
# Rute:
#   /api  -> backend Express  (127.0.0.1:4000)
#   /     -> frontend Next.js (127.0.0.1:3000)
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ganti-domain.com www.ganti-domain.com;

    # Kompresi
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Batas ukuran body upload (mis. import CSV / payload besar)
    client_max_body_size 10m;

    # ---- Backend API (Express, port 4000) ----
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Frontend (Next.js, port 3000) ----
    # Header Upgrade/Connection membuat WebSocket tetap jalan
    # (aman untuk HMR saat dev, dan untuk fitur realtime ke depan).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
