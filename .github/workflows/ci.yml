# ==========================================================================
# AdPulse — CI (GitHub Actions)
#
# Jalan pada push & pull request ke main:
#   - backend  : service PostgreSQL 15 → npm ci → migrate → npm test
#   - frontend : npm ci → next build
#   - syntax   : node --check untuk semua file backend/src/**/*.js
# ==========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (migrate + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: adpulse
          POSTGRES_PASSWORD: adpulse
          POSTGRES_DB: adpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adpulse -d adpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: "4000"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://adpulse:adpulse@localhost:5432/adpulse
      # Test suite membuat database adpulse_test sendiri bila belum ada
      # (user adpulse = superuser di service container) — lihat catatan pada
      # langkah "Migrate database" soal kenapa langkah itu TIDAK boleh ikut
      # NODE_ENV=test.
      DATABASE_URL_TEST: postgres://adpulse:adpulse@localhost:5432/adpulse_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      JWT_ACCESS_TTL: 1h
      REFRESH_TOKEN_TTL_DAYS: "30"
      # Dummy 64 hex untuk AES-256-GCM — HANYA untuk CI, jangan dipakai di produksi.
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      MOCK_ADS: "true"
      DISABLE_CRON: "true"
      AUTH_RATE_LIMIT_MAX: "1000"
      API_RATE_LIMIT_MAX: "10000"
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate database (database/schema.sql)
        # NODE_ENV di-override KHUSUS langkah ini. Dengan NODE_ENV=test,
        # src/config.js memilih DATABASE_URL_TEST (adpulse_test) — database
        # yang belum ada pada titik ini, karena yang membuatnya adalah test
        # helper di langkah berikutnya. Itulah kenapa langkah ini selalu gagal
        # dengan 'database "adpulse_test" does not exist' sejak CI dibuat.
        #
        # Diarahkan ke `adpulse` (dibuat oleh service container), sehingga
        # langkah ini punya makna sendiri: membuktikan schema.sql apply bersih
        # ke database yang benar-benar kosong.
        env:
          NODE_ENV: development
        run: npm run migrate

      - name: Run tests (node --test + supertest)
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  syntax:
    name: Syntax check (node --check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # find + xargs -n1: node --check per file; exit non-zero bila ada
      # satu saja file yang gagal parse (xargs meneruskan kegagalan).
      - name: node --check semua file backend/src
        run: find backend/src -name "*.js" -print0 | xargs -0 -n1 node --check
